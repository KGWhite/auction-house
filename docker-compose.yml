# Everything runs in containers:
#   make up         PostgreSQL + migrations + server + worker + web (http://localhost:5173)
#   make seed       players, item templates, first auction round
#   make test       Go tests in a toolchain container against the compose PostgreSQL
# Tunables come from .env (see .env.example); every value has a default here.

x-app-env: &app-env
  APP_ENV: ${APP_ENV:-dev}
  DATABASE_URL: postgres://${POSTGRES_USER:-auction}:${POSTGRES_PASSWORD:-auction}@postgres:5432/${POSTGRES_DB:-auction}?sslmode=disable
  BID_INCREMENT_PERCENT: ${BID_INCREMENT_PERCENT:-5}
  BID_INCREMENT_MIN: ${BID_INCREMENT_MIN:-10}
  BAND_VERY_SHORT: ${BAND_VERY_SHORT:-2m}
  BAND_SHORT: ${BAND_SHORT:-5m}
  BAND_MEDIUM: ${BAND_MEDIUM:-10m}
  BAND_LONG: ${BAND_LONG:-20m}
  AUCTION_MIN_DURATION: ${AUCTION_MIN_DURATION:-3m}
  AUCTION_MAX_DURATION: ${AUCTION_MAX_DURATION:-25m}
  SETTLE_INTERVAL: ${SETTLE_INTERVAL:-2s}
  SETTLE_BATCH_SIZE: ${SETTLE_BATCH_SIZE:-50}
  REFRESH_INTERVAL: ${REFRESH_INTERVAL:-5m}
  ITEMS_PER_BRACKET: ${ITEMS_PER_BRACKET:-8}
  BRACKET_MIN: ${BRACKET_MIN:-0}
  BRACKET_MAX: ${BRACKET_MAX:-5}

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-auction}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-auction}
      POSTGRES_DB: ${POSTGRES_DB:-auction}
    command: ["postgres", "-c", "max_connections=300"]
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-auction} -d ${POSTGRES_DB:-auction}"]
      interval: 2s
      timeout: 3s
      retries: 30

  migrate:
    build: { context: ., target: tools }
    image: auctionhouse-tools
    command: ["migrate"]
    environment: *app-env
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"

  server:
    build: { context: ., target: server }
    image: auctionhouse-server
    environment:
      <<: *app-env
      HTTP_ADDR: ":8080"
    ports:
      - "${API_PORT:-8080}:8080"
    depends_on:
      migrate: { condition: service_completed_successfully }
    restart: unless-stopped

  worker:
    build: { context: ., target: worker }
    image: auctionhouse-worker
    environment: *app-env
    depends_on:
      migrate: { condition: service_completed_successfully }
    restart: unless-stopped

  web:
    build: { context: ., target: web }
    image: auctionhouse-web
    ports:
      - "${WEB_PORT:-5173}:80"
    depends_on:
      server: { condition: service_healthy }
    restart: unless-stopped

  # ---- one-shot commands: docker compose run --rm tools <command> ----
  tools:
    profiles: ["tools"]
    build: { context: ., target: tools }
    image: auctionhouse-tools
    environment: *app-env
    depends_on:
      migrate: { condition: service_completed_successfully }

  # ---- development toolchain (profile "dev"): tests, sqlc, frontend checks ----
  go:
    profiles: ["dev"]
    image: golang:1.27
    working_dir: /src
    volumes:
      - .:/src
      - gomod:/go/pkg/mod
      - gobuild:/root/.cache/go-build
    environment:
      GOFLAGS: -buildvcs=false
      CGO_ENABLED: "1"
      DATABASE_URL: postgres://${POSTGRES_USER:-auction}:${POSTGRES_PASSWORD:-auction}@postgres:5432/${POSTGRES_DB:-auction}?sslmode=disable
      # Integration tests create and drop their own scratch databases on this server.
      TEST_DATABASE_URL: postgres://${POSTGRES_USER:-auction}:${POSTGRES_PASSWORD:-auction}@postgres:5432/postgres?sslmode=disable
    depends_on:
      postgres: { condition: service_healthy }

  # Same toolchain, but the tests start their own postgres:16 containers with
  # testcontainers-go through the host's Docker socket (no TEST_DATABASE_URL).
  go-tc:
    profiles: ["dev"]
    image: golang:1.27
    working_dir: /src
    volumes:
      - .:/src
      - gomod:/go/pkg/mod
      - gobuild:/root/.cache/go-build
      - /var/run/docker.sock:/var/run/docker.sock
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      GOFLAGS: -buildvcs=false
      CGO_ENABLED: "1"
      TESTCONTAINERS_HOST_OVERRIDE: host.docker.internal

  sqlc:
    profiles: ["dev"]
    image: sqlc/sqlc:1.31.1
    working_dir: /src
    volumes:
      - .:/src

  node:
    profiles: ["dev"]
    image: node:24-alpine
    working_dir: /web
    environment:
      API_PROXY_TARGET: http://server:8080
    volumes:
      - ./web:/web
      - webmodules:/web/node_modules
    ports:
      - "5174:5173"

  # ---- load testing (profile "bench"): see k6/run-smoke.sh ----
  k6:
    profiles: ["bench"]
    image: grafana/k6:latest
    user: root # so handleSummary can write k6/out/smoke-summary.json in the bind mount
    working_dir: /work
    volumes:
      - .:/work
    entrypoint: ["k6"]

volumes:
  pgdata:
  gomod:
  gobuild:
  webmodules:
